services:
  - type: web
    name: sheconnect-app
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: CORS_ORIGINS
        value: https://sheconnect-app.onrender.com
